---
layout: default
---

<article>
  <p><a href="{{ '/' | relative_url }}">← トップページに戻る</a></p>
  <h1>{{ page.title }}</h1>
  <p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time></p>

  {{ content }}

  <hr>
  <nav style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
    <div>
      {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}">← 前の記事: {{ page.previous.title }}</a>
      {% endif %}
    </div>
    <div>
      {% if page.next %}
      <a href="{{ page.next.url | relative_url }}">次の記事: {{ page.next.title }} →</a>
      {% endif %}
    </div>
  </nav>
  <p><a href="{{ '/' | relative_url }}">← トップページに戻る</a></p>
</article>
